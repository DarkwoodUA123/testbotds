<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Милое сердце</title>
<style>
  body { margin: 0; background: #0f0f14; display: flex; justify-content: center; align-items: center; height: 100vh; color: #ffa0c8; font-family: Arial, sans-serif; }
  #container { text-align: center; }
  canvas { display: block; margin: 0 auto; background: transparent; }
</style>
</head>
<body>
<div id="container">
  <canvas id="heartCanvas" width="800" height="600"></canvas>
  <div>ты прелесть 🤩</div>
</div>

<script>
// Здесь будет твоя JS-анимация на canvas, например Heart particles
// Пример простой анимации сердца на JS

const canvas = document.getElementById('heartCanvas');
const ctx = canvas.getContext('2d');
const WIDTH = canvas.width;
const HEIGHT = canvas.height;
const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 - 40 };
const NUM_PARTICLES = 600;

function cuteHeart(t, scale = 1) {
  const x = Math.pow(Math.sin(t), 3);
  const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
  return { x: x * scale * 130, y: y * scale * 10 };
}

let particles = [];

function init() {
  for(let i = 0; i < NUM_PARTICLES; i++) {
    let t = (i / NUM_PARTICLES) * 2 * Math.PI;
    let point = cuteHeart(t, 1.7);
    particles.push({ x: CENTER.x + point.x, y: CENTER.y + point.y, delay: Math.random() * Math.PI * 2 });
  }
}

let time = 0;

function draw() {
  ctx.clearRect(0, 0, WIDTH, HEIGHT);
  ctx.fillStyle = 'rgba(255,160,200,0.8)';
  for(let p of particles) {
    let pulse = 1 + 0.1 * Math.sin((time + p.delay) * 2);
    let dx = p.x - CENTER.x;
    let dy = p.y - CENTER.y;
    ctx.beginPath();
    ctx.arc(CENTER.x + dx * pulse, CENTER.y + dy * pulse, 1, 0, 2 * Math.PI);
    ctx.fill();
  }
  ctx.fillStyle = '#FFBEDE';
  ctx.font = '40px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('ты прелесть 🤩', CENTER.x, CENTER.y + 80);
}

function animate() {
  time += 0.03;
  draw();
  requestAnimationFrame(animate);
}

init();
animate();

</script>
</body>
</html>
